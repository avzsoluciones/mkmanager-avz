# Construye, prueba y publica las imágenes de AVZCloud Central Manager en el registro PRIVADO de GitHub (ghcr.io).
# Disparadores: cada push a main que toque backend/ o frontend-new/, y cada etiqueta de versión vX.Y.Z.
# No usa secretos propios: solo el GITHUB_TOKEN que GitHub entrega a cada ejecución.
name: imagenes

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend-new/**", ".github/workflows/imagenes.yml"]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

# Permisos mínimos: leer el código y escribir paquetes.
permissions:
  contents: read
  packages: write

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRO: ghcr.io
  # Los nombres de imagen deben ir en minúsculas.
  IMAGEN_API: ghcr.io/avzcloud-dev/mkmanager-avz-api
  IMAGEN_WEB: ghcr.io/avzcloud-dev/mkmanager-avz-web

jobs:
  pruebas:
    name: Pruebas del backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

  imagenes:
    name: Construir y publicar (${{ matrix.componente }})
    needs: pruebas
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - componente: api
            contexto: backend
            imagen: ghcr.io/avzcloud-dev/mkmanager-avz-api
          - componente: web
            contexto: frontend-new
            imagen: ghcr.io/avzcloud-dev/mkmanager-avz-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en el registro
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.imagen }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}
