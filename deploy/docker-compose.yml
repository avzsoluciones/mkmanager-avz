# AVZCloud Central Manager - compose por defecto: INSTALACION LIMPIA en cualquier servidor Linux con Docker.
# Procedimiento: deploy/INSTALACION-NUEVO-SERVIDOR.md (script deploy/instalar.sh). Arquitectura: deploy/ARQUITECTURA.md.
# Para MIGRAR el srv-2 actual (volumen existente, nombres fijos) se agrega el override docker-compose.srv2.yml
# (runbook deploy/DEPLOY.md): docker compose -f docker-compose.yml -f docker-compose.srv2.yml ...
#
# Principios (cada decision esta comentada donde se aplica):
#  - Ningun secreto en este archivo: todo viene de `.env` por interpolacion ${VAR}.
#  - El proxy de entrada (con TLS) es la unica entrada publica; aqui todo se publica solo en loopback por defecto.
#  - PostgreSQL no se publica en ningun puerto y vive en una red `internal` (sin salida a Internet).
#  - Contenedores sin privilegios: sin capacidades, sin escalada, raiz de solo lectura, con limites.
#  - NO se monta init_postgres.sql: el esquema lo crea la migracion 001 (sin usuarios de demostracion).
#
# El nombre de proyecto NO se fija aqui: Compose lo deriva de `-p`, de COMPOSE_PROJECT_NAME o del directorio.
# Asi se puede levantar un segundo stack de prueba en el mismo servidor sin chocar (contenedores, red y volumen
# llevan el prefijo del proyecto). Los scripts (instalar.sh, respaldo.sh...) usan -p y --env-file ../.env.
# Los contextos de build son relativos a ESTE archivo (deploy/), por eso `../backend` y `../frontend-new`.

# Entorno de la API definido una sola vez (lo reutiliza el servicio `cli`).
# En vez de `env_file: .env` (que inyectaria TODO el .env y quedaria visible en `docker inspect`) se pasa solo
# lo que el backend lee (app/config.py, services/monitoring.py, services/alerts.py, main.py). `:?` aborta con un
# mensaje si falta una variable obligatoria; `:-` deja un valor por defecto para las opcionales.
x-api-env: &api-env
  # Host de la BD = NOMBRE DEL SERVICIO (lo resuelve el DNS de Compose en db-net, sin depender del container_name).
  POSTGRES_HOST: mikrotik-db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en .env}
  POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
  SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY en .env}
  VAULT_KEY: ${VAULT_KEY:?defina VAULT_KEY en .env}
  TOKEN_HOURS: ${TOKEN_HOURS:-12}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  HUB_HOST: ${HUB_HOST:-}
  HUB_API_PORT: ${HUB_API_PORT:-8728}
  HUB_API_USER: ${HUB_API_USER:-}
  HUB_API_PASSWORD: ${HUB_API_PASSWORD:-}
  HUB_WG_INTERFACE: ${HUB_WG_INTERFACE:-}
  HUB_PUBLIC_ENDPOINT: ${HUB_PUBLIC_ENDPOINT:-}
  HUB_PUBLIC_PORT: ${HUB_PUBLIC_PORT:-51820}
  EDGE_API_USER: ${EDGE_API_USER:-}
  EDGE_API_PASSWORD: ${EDGE_API_PASSWORD:-}
  MONITOR_ENABLED: ${MONITOR_ENABLED:-1}
  MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
  MONITOR_ONLINE_SECONDS: ${MONITOR_ONLINE_SECONDS:-180}
  MONITOR_ALERT_MINUTES: ${MONITOR_ALERT_MINUTES:-5}
  MONITOR_RETENTION_DAYS: ${MONITOR_RETENTION_DAYS:-90}
  MONITOR_SAMPLE_SECONDS: ${MONITOR_SAMPLE_SECONDS:-300}
  MONITOR_RX_WINDOW_SECONDS: ${MONITOR_RX_WINDOW_SECONDS:-90}
  MONITOR_RX_STALE_SECONDS: ${MONITOR_RX_STALE_SECONDS:-300}
  ALERT_EXTRA_RECIPIENTS: ${ALERT_EXTRA_RECIPIENTS:-}
  # IP real del cliente (SEG-005): uvicorn solo cree en X-Forwarded-For si la conexion viene de estas IPs.
  # Por defecto = pasarela de edge-net, la IP con la que la API ve al proxy de entrada que llega por loopback.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-${AVZ_EDGE_GATEWAY:-172.29.91.1}}

services:
  # ------------------------------------------------------------------------------------------ BD
  mikrotik-db:
    image: postgres:16-alpine           # misma version que el srv-2 actual: un volumen migrado es compatible
    # Sin container_name: Compose lo deriva del proyecto. La API llega por el nombre del servicio.
    restart: unless-stopped
    environment:
      # Solo se aplican al CREAR un volumen vacio; con un volumen existente no cambian nada.
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
    # Contrasenas nuevas con SCRAM (no afecta a las ya guardadas).
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # (Sin ./init_postgres.sql: sembraba usuarios de demostracion. SEG-002.)
    # SIN `ports`: nadie fuera de la red del compose llega a PostgreSQL.
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Endurecimiento. VALIDAR EN LABORATORIO antes de produccion: si el contenedor no arranca,
    # quitar `read_only` y las lineas de `tmpfs` (ver DEPLOY.md, "Si la BD no arranca").
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # el entrypoint de postgres arranca como root y baja a `postgres`
    mem_limit: 512m
    pids_limit: 200

  # ------------------------------------------------------------------------------------------ API
  mikrotik-api:
    build:
      context: ../backend
    # Sin image ni container_name: Compose usa <proyecto>-mikrotik-api. (El override srv2 fija los nombres actuales.)
    restart: unless-stopped
    depends_on:
      mikrotik-db:
        condition: service_healthy
    environment:
      <<: *api-env
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8090}:8000"   # solo loopback por defecto: el proxy de entrada es la unica entrada
    networks:
      - db-net                                # llega a la BD
      - edge-net                              # sale al hub (red privada) y a SMTP; publica el puerto
    healthcheck:                               # sin curl: Python (igual que el HEALTHCHECK de la imagen)
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s                        # margen para aplicar migraciones al arrancar
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 200

  # ------------------------------------------------------------------------------------------ Interfaz
  mikrotik-frontend:
    build:
      context: ../frontend-new
      args:
        ASSET_VERSION: ${ASSET_VERSION:-1}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8091}:8080"   # nginx sin privilegios escucha en 8080
    networks:
      - edge-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 100

  # ------------------------------------------------------------------------------------------ CLI
  # Comandos de administracion, bajo demanda (perfil `tools`; `up -d` no lo arranca):
  #   docker compose -p <proyecto> --env-file ../.env --profile tools run --rm cli check-env
  #   docker compose -p <proyecto> --env-file ../.env --profile tools run --rm cli migrate
  # La contrasena inicial del superadmin NO esta en .env: se pasa solo en el comando (instalar.sh lo hace).
  cli:
    # Misma imagen que la API, construida desde el mismo contexto (la cache de Docker evita rehacer capas).
    build:
      context: ../backend
    profiles: ["tools"]
    entrypoint: ["python", "-m", "app.cli"]
    command: ["check-env"]
    environment:
      <<: *api-env
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    networks:
      - db-net                                # solo necesita la BD
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 50

volumes:
  # Volumen normal con nombre derivado del proyecto (<proyecto>_postgres_data). NUNCA `down -v` en produccion.
  # Para adoptar el volumen existente del srv-2 se usa docker-compose.srv2.yml (lo declara external).
  postgres_data: {}

networks:
  # Red interna: sin ruta a Internet ni al host. Solo la API y la CLI alcanzan PostgreSQL.
  db-net:
    driver: bridge
    internal: true
  # Red con salida: la API necesita llegar al hub (red privada) y al SMTP. Subred fija para que la
  # pasarela (IP con la que la API ve al proxy de entrada) sea conocida y se pueda confiar en ella.
  # Si choca con otra red del servidor: AVZ_EDGE_SUBNET y AVZ_EDGE_GATEWAY en .env (instalar.sh --subred).
  edge-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${AVZ_EDGE_SUBNET:-172.29.91.0/24}
          gateway: ${AVZ_EDGE_GATEWAY:-172.29.91.1}
