# nginx sin privilegios (usuario 101) para la interfaz estatica. Reemplaza /etc/nginx/nginx.conf.
# Solo escribe en /tmp (tmpfs en el compose): permite read_only: true en el contenedor.
# No proxya la API: OpenResty reenvia /api/ a la API y / a este contenedor.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;                       # sin version de nginx en cabeceras ni paginas de error
    access_log    /dev/stdout;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 30s;

    # Rutas temporales en /tmp (unico directorio escribible).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Sitio estatico de solo lectura: ningun cuerpo de peticion legitimo.
    client_max_body_size 1k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    # Cache de css/js: con ?v=<version> (index.html lo agrega al construir) = 1 anio inmutable;
    # sin version (modulos importados entre si) = se revalida siempre por ETag.
    map $arg_v $static_cache {
        default "no-cache";
        "~."    "public, max-age=31536000, immutable";
    }

    server {
        listen 8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;
        autoindex off;                       # sin listado de directorios

        # Solo lectura.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        # Sondeo de salud (sin log, sin cabeceras de cache).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Pagina de entrada: nunca en cache, para que una nueva version llegue de inmediato.
        location = / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files /index.html =404;
        }
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # Datos simulados: no se publican (la imagen tampoco los contiene).
        location = /js/mock.js { return 404; }

        # CSS y JS.
        location ~* \.(?:css|js)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control $static_cache always;
            try_files $uri =404;
        }

        # Logos e iconos: cambian poco (7 dias).
        location /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        # Archivos ocultos y cualquier otra cosa: 404 (la interfaz usa rutas por hash, sin fallback SPA).
        location ~ /\. { return 404; }
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        error_page 404 /404.txt;
        location = /404.txt { internal; return 404 "No encontrado\n"; }
    }
}
