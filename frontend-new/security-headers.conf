# Cabeceras de seguridad. Se incluye en CADA location porque nginx NO hereda add_header en una
# location que defina las suyas (p. ej. Cache-Control).
#
# CSP verificada contra frontend-new: un unico <script> clasico externo (js/theme-init.js) y un modulo
# (js/main.js); ningun <style>, atributo style ni manejador en linea (los estilos dinamicos usan
# style.setProperty, que CSSOM permite); sin CDN ni fuentes externas; fetch solo a /api/v1 (mismo
# origen, cubierto por default-src); el codigo QR se muestra como <img src="blob:..."> (img-src blob:);
# la descarga del .conf/.rsc usa un enlace blob: (no es una carga de recurso).
# object-src 'none' se agrega a la lista pedida (endurece, no cambia el comportamiento).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS lo emite OpenResty (es quien termina TLS); no se duplica aqui.
